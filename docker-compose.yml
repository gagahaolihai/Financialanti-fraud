# ============================================
# 反诈卫士 - Docker Compose 配置
# 支持单机/混合云部署模式
# ============================================
version: "3.8"

services:
  # ---------- 主应用 ----------
  app:
    build: .
    image: antifraud-system:latest
    container_name: antifraud-app
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # 数据持久化
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
      # 配置文件
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - CLOUD_DEPLOYMENT=single
      - LLM_ENABLED=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - antifraud-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- Nginx 反向代理（生产环境 HTTPS） ----------
  nginx:
    image: nginx:alpine
    container_name: antifraud-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - antifraud-net
    profiles:
      - production

  # ---------- Redis 缓存/限流存储（可选） ----------
  redis:
    image: redis:7-alpine
    container_name: antifraud-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - antifraud-net
    profiles:
      - production

networks:
  antifraud-net:
    driver: bridge

volumes:
  redis-data:
